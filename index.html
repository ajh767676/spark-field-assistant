<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark Field Assistant</title>



  <style>
    .inspection-item.complete {
      background: #dcfce7;
      color: #166534;
    }
    .inspection-list {
      display: grid;
      gap: 12px;
      margin: 18px 0;
    }

    .inspection-item {
      background: #f3f4f6;
      color: var(--text);
      text-align: left;
      padding: 18px;
      border-radius: 14px;
      font-size: 17px;
    }
    :root {
      --navy: #101827;
      --orange: #e65a00;
      --light: #f7f4ef;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--light);
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--navy);
      color: white;
      padding: 45px 18px;
      text-align: center;
      border-bottom: 3px solid var(--orange);
    }

    .brand-logo {
      width: 150px;
      height: auto;
      display: block;
      margin: 0 auto 20px;
    }

    .logo {
      color: var(--orange);
      font-weight: bold;
      letter-spacing: 1px;
      font-size: 14px;
    }

    h1 {
      font-size: 42px;
      margin: 12px 0;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 18px;
      margin-top: 10px;
    }

    main {
      flex: 1;
      padding: 18px;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .primary {
      background: var(--orange);
      color: white;
    }

    .secondary {
      background: #111827;
      color: white;
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-top: 18px;
    }

    .bottom-bar {
      position: sticky;
      bottom: 0;
      background: var(--navy);
      color: white;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      color: var(--orange);
    }

    .screen-label {
      color: var(--orange);
      font-weight: bold;
      letter-spacing: 1px;
      font-size: 13px;
      text-transform: uppercase;
      margin: 0 0 8px;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 26px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: #f3f4f6;
      border-radius: 14px;
      padding: 16px;
    }

    .stat-label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat-card strong {
      font-size: 24px;
    }
  
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .inspection-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .inspection-condition {
      color: var(--muted);
      font-size: 14px;
    }

    .inspection-cost {
      color: var(--orange);
      font-weight: bold;
      margin-right: 8px;
    }

    .photo-label {
      color: #6b7280;
      font-size: 13px;
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
      margin-top: 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .summary-item small {
      display: block;
      margin-top: 4px;
    }

    .summary-notes {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 22px 0;
      padding: 18px;
      border-radius: 14px;
      background: var(--navy);
      color: white;
    }

    .summary-total strong {
      color: var(--orange);
      font-size: 24px;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <img src="assets/images/spark-logo.png" alt="Spark Homes Logo" class="brand-logo" />

      <h1>Spark Field Assistant</h1>
      <p class="subtitle">Fast repair estimates for property walkthroughs</p>
    </header>

    <main>
      <section class="card">
        <label for="propertyName">Property Address</label>
        <input id="propertyName" type="text" placeholder="Example: 123 Main Street" />

        <button class="primary" onclick="startWalkthrough()">Start Guided Walkthrough</button>
        <button class="secondary">Open Saved Projects</button>

        <p class="hint">
          Built for agents walking properties in the field. Big buttons, fast totals,
          offline-first design, and a guided workflow instead of a spreadsheet.
        </p>
      </section>
    </main>

    <div class="bottom-bar">
      <span>Estimated Repairs</span>
      <span class="total">$0</span>
    </div>
  </div>

<script>
  let currentScreen = "home";

  const appData = {
    currentProject: null,
    exteriorChecklist: {
      Roof: { complete: false, cost: 1100, photo: null },
      Gutters: { complete: false, cost: 500, photo: null },
      Siding: { complete: false, cost: 975, photo: null },
      Windows: { complete: false, cost: 425, photo: null },
      Garage: { complete: false, cost: 1225, photo: null },
      Trees: { complete: false, cost: 450, photo: null }
    },

    interiorChecklist: {
      Flooring: { complete: false },
      "Paint & Wall Repair": { complete: false },
      Doors: { complete: false },
      "Pest Control": { complete: false }
    }
  };

  function startWalkthrough() {
    const propertyName = document.getElementById("propertyName").value.trim();

    if (!propertyName) {
      alert("Enter a property address first.");
      return;
    }

    appData.currentProject = {
      id: Date.now(),
      address: propertyName,
      repairTotal: 0,
      progress: 0,
      createdAt: new Date().toISOString()
    };

    localStorage.setItem(
      "currentProject",
      JSON.stringify(appData.currentProject)
    );

    showDashboard();
  }

  function getExteriorProgress() {
  const items = Object.keys(appData.exteriorChecklist);
  const completed = items.filter(item => appData.exteriorChecklist[item].complete).length;

  return {
    completed: completed,
    total: items.length,
    percent: Math.round((completed / items.length) * 100)
    };
  }

  function getRepairTotal() {
  const items = Object.keys(appData.exteriorChecklist);

  return items.reduce((total, item) => {
    if (appData.exteriorChecklist[item].complete) {
      return total + appData.exteriorChecklist[item].cost;
    }

    return total;
    }, 0);
  }

  function showDashboard() {
    currentScreen = "dashboard";
    const exteriorProgress = getExteriorProgress();
    const repairTotal = getRepairTotal();

    document.querySelector("main").innerHTML = `
      <section class="card">
        <p class="screen-label">Current Property</p>
        <h2>${appData.currentProject.address}</h2>

        <div class="stat-grid">
          <div class="stat-card">
            <span class="stat-label">Repair Total</span>
            <strong>$${repairTotal.toLocaleString()}</strong>
          </div>

          <div class="stat-card">
            <span class="stat-label">Progress</span>
            <strong>${exteriorProgress.percent}%</strong>
          </div>
        </div>

        <p class="hint">
          Exterior: ${exteriorProgress.completed} / ${exteriorProgress.total} complete
        </p>

        <button class="primary" onclick="showSections()">
          Begin Guided Inspection
        </button>

        <button class="secondary" onclick="showSummary()">
          View Repair Summary
        </button>

        <button class="secondary">
          Open Deal Analyzer
        </button>
      </section>
    `;

    document.querySelector(".bottom-bar .total").textContent =
      "$" + repairTotal.toLocaleString();
  }

  function showComingSoon(sectionName) {
    alert(sectionName + " will be built next.");
  }

  function showSections() {
  const exteriorProgress = getExteriorProgress();

  document.querySelector("main").innerHTML = `
    <section class="card">
      <p class="screen-label">Guided Inspection</p>
      <h2>${appData.currentProject.address}</h2>

      <div class="inspection-list">
        <button class="inspection-item" onclick="showExteriorInspection()">
          <div>
            <strong>Exterior</strong>
            <br>
            <small class="inspection-condition">
              ${exteriorProgress.completed} of ${exteriorProgress.total} complete
            </small>
          </div>
          <span>›</span>
        </button>

        <button class="inspection-item" onclick="showInteriorInspection()">
          <div>
            <strong>Interior / General</strong>
            <br>
            <small class="inspection-condition">Not started</small>
          </div>
          <span>›</span>
        </button>

        <button class="inspection-item" onclick="showComingSoon('Kitchen')">
          <div>
            <strong>Kitchen</strong>
            <br>
            <small class="inspection-condition">Not started</small>
          </div>
          <span>›</span>
        </button>

        <button class="inspection-item" onclick="showComingSoon('Bathrooms')">
          <div>
            <strong>Bathrooms</strong>
            <br>
            <small class="inspection-condition">Not started</small>
          </div>
          <span>›</span>
        </button>

        <button class="inspection-item" onclick="showComingSoon('Systems & Structure')">
          <div>
            <strong>Systems & Structure</strong>
            <br>
            <small class="inspection-condition">Not started</small>
          </div>
          <span>›</span>
        </button>
      </div>

      <button class="secondary" onclick="showDashboard()">
        Return to Dashboard
      </button>
    </section>
  `;
}

  function showInteriorInspection() {
    const groups = Object.keys(appData.interiorChecklist);
    const completed = groups.filter(
      group => appData.interiorChecklist[group].complete
    ).length;

    document.querySelector("main").innerHTML = `
      <section class="card">
        <p class="screen-label">Interior / General</p>
        <h2>${appData.currentProject.address}</h2>

        <div class="inspection-list">
          ${groups.map(group => `
            <button
              class="inspection-item"
              onclick="openInteriorGroup('${group}')"
            >
              <div>
                <strong>${group}</strong>
                <br>
                <small class="inspection-condition">
                  ${
                    appData.interiorChecklist[group].complete
                      ? "Reviewed"
                      : "Not reviewed yet"
                  }
                </small>
              </div>

              <span>›</span>
            </button>
          `).join("")}
        </div>

        <p class="hint">
          Progress: ${completed} / ${groups.length} groups complete
        </p>

        <button class="secondary" onclick="showSections()">
          Return to Sections
        </button>
      </section>
    `;
  }

  function openInteriorGroup(groupName) {
    document.querySelector("main").innerHTML = `
      <section class="card">
        <p class="screen-label">Interior / General</p>
        <h2>${groupName}</h2>

        <p class="hint">
          Official repair items for this group will be added next.
        </p>

        <button
          class="primary"
          onclick="markInteriorGroupComplete('${groupName}')"
        >
           No Action Needed
        </button>

        <button class="secondary" onclick="showInteriorInspection()">
          Cancel
        </button>
      </section>
    `;
  }
    
  function markInteriorGroupComplete(groupName) {
    appData.interiorChecklist[groupName].complete = true;
    showInteriorInspection();
  }
  function toggleExteriorItem(itemName) {
    appData.exteriorChecklist[itemName].complete =
     !appData.exteriorChecklist[itemName].complete;

    showExteriorInspection();
  }


  function openInspectionDetail(itemName) {

  
  const item = appData.exteriorChecklist[itemName];

  document.querySelector("main").innerHTML = `
    <section class="card">
      <p class="screen-label">Exterior Detail</p>
      <h2>${itemName} Inspection</h2>

      <label for="condition">Condition</label>
      <select id="condition">
        <option value="Good">Good</option>
        <option value="Minor Repair">Minor Repair</option>
        <option value="Major Repair">Major Repair</option>
        <option value="Replace">Replace</option>
      </select>

      <label for="repairCost">Estimated Cost</label>
      <input id="repairCost" type="number" value="${item.cost}" />

      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="Add notes about this repair..."></textarea>

      <label for="photoInput">Photo</label>

  <input
    id="photoInput"
    type="file"
    accept="image/*"
    capture="environment"
    onchange="previewPhoto(event, '${itemName}')"
  />

  <div id="photoPreview">
    ${
      item.photo
        ? `<img src="${item.photo}" class="photo-thumbnail" alt="${itemName} photo">`
        : `<p class="hint">No photo attached</p>`
    }
  </div>

  <button class="primary" onclick="saveInspectionDetail('${itemName}')">
          Save Detail
      </button>
      <button class="secondary" onclick="showExteriorInspection()">
          Cancel
      </button>
    </section>
  `;
}
  function saveInspectionDetail(itemName) {
    const condition = document.getElementById("condition").value;
    const repairCost = Number(document.getElementById("repairCost").value);
    const notes = document.getElementById("notes").value.trim();

    appData.exteriorChecklist[itemName].condition = condition;
    appData.exteriorChecklist[itemName].cost = repairCost;
    appData.exteriorChecklist[itemName].notes = notes;
    appData.exteriorChecklist[itemName].complete = true;

    const photoFile = document.getElementById("photoInput").files[0];

    if (photoFile) {
    savePhoto(itemName, photoFile);
    }

    showExteriorInspection();
}
  function showSummary() {
    const completedItems = Object.entries(appData.exteriorChecklist)
      .filter(([itemName, itemData]) => itemData.complete);

    const repairTotal = getRepairTotal();

    document.querySelector("main").innerHTML = `
      <section class="card">
        <p class="screen-label">Repair Summary</p>
        <h2>${appData.currentProject.address}</h2>

        ${
          completedItems.length === 0
            ? `<p class="hint">No repairs have been completed yet.</p>`
            : completedItems.map(([itemName, itemData]) => `
                <div class="summary-item">
                  <div>
                    <strong>${itemName}</strong>
                    <small class="inspection-condition">
                      ${itemData.condition || "Reviewed"}
                    </small>

                    ${
                      itemData.notes
                        ? `<p class="summary-notes">${itemData.notes}</p>`
                        : ""
                    }

                    ${
                      itemData.photo
                        ? `<small class="photo-label">📷 Photo</small>`
                        : ""
                    }
                  </div>

                  <span class="inspection-cost">
                    $${itemData.cost.toLocaleString()}
                  </span>
                </div>
              `).join("")
        }

        <div class="summary-total">
          <span>Estimated Repairs</span>
          <strong>$${repairTotal.toLocaleString()}</strong>
        </div>

        <button class="secondary" onclick="showDashboard()">
          Return to Dashboard
        </button>
      </section>
    `;
  }

  function previewPhoto(event, itemName) {
    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        appData.exteriorChecklist[itemName].photo = e.target.result;

        document.getElementById("photoPreview").innerHTML =
            `<img src="${e.target.result}" class="photo-thumbnail" alt="Preview">`;
    };

    reader.readAsDataURL(file);
}
  function savePhoto(itemName, file) {
  const reader = new FileReader();

  reader.onload = function(event) {
    appData.exteriorChecklist[itemName].photo = event.target.result;
  };

  if (file) {
    reader.readAsDataURL(file);
  }
}
  function showExteriorInspection() {
  currentScreen = "exterior";

  const items = Object.keys(appData.exteriorChecklist);
  const completed = items.filter(item => appData.exteriorChecklist[item].complete).length;

  document.querySelector("main").innerHTML = `
    <section class="card">
      <p class="screen-label">Exterior Inspection</p>
      <h2>${appData.currentProject.address}</h2>

      <div class="inspection-list">
        ${items.map(item => `
          <button 
            class="inspection-item ${appData.exteriorChecklist[item].complete ? "complete" : ""}"
            onclick="openInspectionDetail('${item}')"
          >
           <div>
              <strong>
                ${appData.exteriorChecklist[item].complete ? "✅" : "⬜"} ${item}
              </strong>

              <br>

              <small>
                ${appData.exteriorChecklist[item].condition || "Not reviewed yet"}
              </small>

              ${appData.exteriorChecklist[item].photo
                ? "<br><small>📷 Photo</small>"
                : ""}
            </div>

<span class="inspection-cost">
  $${appData.exteriorChecklist[item].cost.toLocaleString()}
</span> 
          </button>
        `).join("")}
      </div>

      <p class="hint">Progress: ${completed} / ${items.length} complete</p>

      <button class="secondary" onclick="showDashboard()">Save & Return to Dashboard</button>
    </section>
    `;
  }
</script>
</body>
</html>
